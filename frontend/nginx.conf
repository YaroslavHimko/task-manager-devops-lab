server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browser calls /api/tasks. The reverse proxy forwards it to the API container.
    # Keep the /api prefix: ASP.NET endpoints start with /api.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # This makes client-side routes work even when refreshing the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
